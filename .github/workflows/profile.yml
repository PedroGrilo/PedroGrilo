name: Profile assets

# Renders every image used by README.md and publishes them to the `output` branch.
# `main` only holds the source; generated SVGs never create commits on `main`.

on:
  # Once a day at 05:37 UTC (deliberately off the hour: GitHub delays jobs scheduled at minute 0).
  schedule:
    - cron: "37 5 * * *"

  # Manual run: Actions tab > Profile assets > Run workflow, or `gh workflow run profile.yml`.
  workflow_dispatch:

  # Re-render whenever the generator, its content or this workflow changes.
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: read

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  render:
    name: Render and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the publish step pushes the `output` branch

    steps:
      - name: Check out the generator
        uses: actions/checkout@v7

      # Dependency-free script; runs on the Node.js that ships with the runner (>= 20).
      - name: Render cards, stats and the repo snake
        run: node scripts/generate.mjs --out dist
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check that every image was rendered
        run: |
          ls -la dist
          for f in hero repo-snake stack stats languages; do
            test -s "dist/$f-dark.svg" && test -s "dist/$f-light.svg" || { echo "::error::missing $f"; exit 1; }
          done

      # Force-pushes ./dist as a single orphan commit to the `output` branch.
      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update profile assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
