<title id="t">Tech stack</title>
<desc id="d">Frontend: React, TypeScript, Vue.js, Next.js, Tailwind CSS, Redux Toolkit. Real-time &amp; maps: WebSockets, WebRTC, Yjs &amp; CRDTs, OpenLayers. Desktop &amp; systems: Rust, Tauri, Electron, Python. Backend, when needed: Node.js, Java &amp; Quarkus, PostgreSQL &amp; PostGIS. Testing &amp; tooling: Vitest, Playwright, Vite, Docker, GitHub Actions. Home lab: Home Assistant, HACS, Immich, NAS &amp; WebDAV</desc>
